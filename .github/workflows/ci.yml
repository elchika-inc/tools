# PR CI — 型検査 + ユニットテスト + ビルド + 成果物のアセットパス検査
#
# 方針（standards `DOCS_OPS.md` §6「役割分担」）:
#   lint / fmt はローカル（`vp check` / `vp fmt`）が一次責任者。CI が担うのは
#   「安く・決定的に落ちるチェック」だけ。実ブラウザを起動するテスト（Playwright）は
#   ここへ足さない —— §6「E2E は CI で実行しない（MUST NOT）」。
#   E2E はローカルの `pnpm test:e2e`（`playwright.config.ts`）で担保する。
#
# 信頼境界（`DOCS_OPS.md` §6「エージェント管理ブランチの信頼境界」MUST）:
#   この workflow の job は secrets を1つも参照せず、`permissions` は read のみ、
#   `environment` を持たず、GitHub-hosted runner で動く。つまり §6 冒頭の MUST の
#   **内側**に留まっており、「信頼済みと見なせる条件」による緩和を採っていない。
#   緩和を採っていないので `.docs/risk-registry.md` への緩和記録の対象ではない。
#   **secrets の参照・`permissions` の write 化・`environment` の追加・self-hosted への
#   変更は、いずれもこの前提を壊す**（その時点で §6 の緩和記録が MUST になる）。
#
# required status check の context 名は **`ci`**（下の job id）。
#   job に `name:` を置いていないのは、context 名の出所を job id 1箇所に閉じるため。
#   **この id を変えると required が存在しない名前を指し、以後すべての PR が
#   「Expected — waiting」のまま永久に BLOCKED になる。**
#   job を分割するときは、miseru の `all-green` のような集約 job を立てて
#   required の対象を1つの固定名へ寄せること（matrix の展開名を required にしない）。

name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 変更を base との差分で求めるため履歴が要る（浅い clone では
          # `github.event.pull_request.base.sha` が到達不能になりうる）。
          # `--depth=1` の追加 fetch は行わない（`.git/shallow` が後続の
          # `git diff` を壊すため）。
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR 由来の値は `env:` 経由で渡す（`${{ }}` を shell へ直接展開しない）。
      # `apps`  = 変更されたアプリのディレクトリ（ビルド対象）
      # `files` = 変更された TypeScript ソース（型検査の追加対象）
      #           削除されたファイルは `[ -f ]` で落とす。
      - name: Detect changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          diff=$(git diff --name-only "$BASE_SHA" HEAD -- 'apps/')
          apps=$(printf '%s\n' "$diff" | cut -d/ -f1,2 | sort -u)
          files=$(printf '%s\n' "$diff" | grep -E '\.tsx?$' || true)
          echo "変更されたアプリ:"
          printf '%s\n' "${apps:-(なし)}"
          echo "変更された TS ファイル:"
          printf '%s\n' "${files:-(なし)}"
          {
            echo 'apps<<EOF'
            printf '%s\n' "$apps"
            echo 'EOF'
            echo 'files<<EOF'
            printf '%s\n' "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # 型検査はビルドより前に置く（`DOCS_OPS.md` §6 MUST）。
      # `vp build` は型エラーがあっても exit 0 を返すので、ビルドに型検査を任せない。
      #
      # **段階導入**（§6「既に型エラーを抱えているプロジェクトは段階導入してよい（MAY）」）:
      #   リポジトリ全体は 2017 件の型エラーを持ち、全体を対象にすると恒久赤になる。
      #   対象は「常時検査する green なベースライン（`packages/router/src`）」＋
      #   「その PR が変更した TypeScript ファイル**そのもの**」に絞る。
      #   **アプリの `src/` 全体ではなくファイル単位にしているのは実測に基づく** ——
      #   サンプルした 21/21 のアプリが `src/` のどこかに既存の型エラーを持ち、
      #   ディレクトリ単位にするとアプリを1行でも触る PR がほぼ必ず赤になって、
      #   `auto-on-green` の条件1 が満たせなくなる。ファイル単位なら、赤になるのは
      #   「触ったファイル自身に型エラーがある」場合だけで、被覆は boy scout rule で
      #   単調に広がる（縮まない）。実測値と残る赤の率は
      #   `.docs/risk-registry.md` の RISK-001 が正本。
      - name: Typecheck
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          targets=(packages/router/src)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # 削除されたファイルは diff に現れるが実体が無いので落とす
            [ -f "$f" ] || continue
            targets+=("$f")
          done <<< "$CHANGED_FILES"
          echo "型検査の対象: ${targets[*]}"
          pnpm exec vp check --no-fmt --no-lint "${targets[@]}"

      # ユニットテストのみ。`vp test` が実際に読む設定は root の `vite.config.ts` の
      # `test` ブロック（`vitest.config.*` は存在しない）で、`exclude` に `**/e2e/**` が
      # あるため Playwright の spec は収集対象に入らない。`vp test` は組み込みコマンドで
      # `package.json` の scripts を読まないので、`test:e2e` 等のライフサイクル連鎖も無い。
      #
      # **隔離リスト（quarantine）**: 下記のテストファイルは本 workflow の新設以前から
      #   `main` で赤い。赤のまま載せると `auto-on-green` の条件1（green であること）を
      #   原理的に満たせなくなるため、CI 側でだけ除外する。
      #   **root の `vite.config.ts` は変更していない** —— ローカルの `pnpm exec vp test` は
      #   これらを実行し続け、失敗は隠れない。
      #   一覧と各件の原因・解除条件は `.docs/risk-registry.md` の RISK-002 に記録している。
      #   **このリストへの追加は被覆の縮小にあたる。追加する PR は同じ PR で RISK-002 を更新すること。**
      - name: Unit test
        run: |
          set -euo pipefail
          pnpm exec vp test --run \
            --exclude 'apps/bcrypt-hash/src/utils/__tests__/bcryptHash.test.ts' \
            --exclude 'apps/hash-crc32/src/utils/__tests__/crc32.test.ts' \
            --exclude 'apps/hash-md5/src/utils/__tests__/md5.test.ts' \
            --exclude 'apps/zip-creator/src/utils/__tests__/zipCreator.test.ts' \
            --exclude 'apps/sql-playground/src/utils/__tests__/sqlEngine.test.ts' \
            --exclude 'packages/mcp-server/src/__tests__/registry.test.ts' \
            --exclude 'apps/file-rename-batch/src/utils/__tests__/rename.test.ts' \
            --exclude 'apps/geo-distance/src/utils/__tests__/geoDistance.test.ts' \
            --exclude 'apps/k8s-yaml-generator/src/utils/__tests__/k8sGenerator.test.ts' \
            --exclude 'apps/markdown-to-slides/src/utils/__tests__/slideParser.test.ts' \
            --exclude 'apps/nato-phonetic/src/utils/__tests__/nato.test.ts' \
            --exclude 'packages/router/src/__tests__/index.test.ts'

      # 全 346 アプリのビルドは PR ごとに回すには高すぎる（§6「安く・決定的に落ちる
      # チェックだけ」）。変更されたアプリだけをビルドする。
      # 変更が無い PR ではビルド対象が0件になるが、それは検査の省略ではなく
      # 「このPRがアプリのソースを1行も変えていない」ことの帰結である。
      #
      # **wasm 依存アプリの skip**: `packages/wasm-utils/pkg/` は gitignore 対象で
      #   チェックアウトに含まれず、生成には Rust ツールチェーンと `wasm-pack` が要る
      #   （`build.sh` / `package.json` の postinstall）。runner にはどちらも無いため、
      #   `wasm-utils` に依存するアプリは pkg 不在ではビルドできない（ローカル実測:
      #   pkg を退避して `apps/bcrypt-hash` を `pnpm run build` すると exit 1）。
      #   pkg が存在すれば通常どおりビルドするので、CI へ wasm-pack を導入すれば
      #   この分岐は自動的に無効になる。skip は必ずログへ出す（サイレントな打ち切りにしない）。
      #   受容と解除条件は `.docs/risk-registry.md` の RISK-006 に記録している。
      - name: Build changed apps
        env:
          CHANGED_APPS: ${{ steps.changed.outputs.apps }}
        run: |
          set -euo pipefail
          # `set -e` 下で `[ ... ] && x=1` は AND-OR list の非最終要素なので中断しない
          # （実測済み）が、その依存は暗黙的なので if で明示する。
          if [ -d packages/wasm-utils/pkg ]; then wasm_ready=1; else wasm_ready=0; fi
          built=0
          skipped=0
          notdir=0
          while IFS= read -r app; do
            [ -n "$app" ] || continue
            # 削除されたアプリと `apps/` 直下のファイル（cut がそのまま返す）。
            # 内訳を必ず数える —— 検出数と built+skipped が合わないと
            # 「サイレントな打ち切りにしない」という anchor の主張が崩れるため。
            if [ ! -d "$app" ]; then
              echo "対象外（ディレクトリではない / 削除済み）: $app"
              notdir=$((notdir + 1))
              continue
            fi
            # 依存の有無はハードコードした一覧ではなく package.json から導出する
            # （アプリが増減しても一覧が陳腐化しないため）。
            if [ "$wasm_ready" -eq 0 ] && grep -q 'wasm-utils' "$app/package.json"; then
              echo "::warning::$app は wasm-utils に依存し packages/wasm-utils/pkg が無いため skip した（RISK-006）"
              skipped=$((skipped + 1))
              continue
            fi
            echo "::group::Building $app"
            (cd "$app" && pnpm run build)
            echo "::endgroup::"
            built=$((built + 1))
          done <<< "$CHANGED_APPS"
          echo "ビルドしたアプリ: $built 件 / skip: $skipped 件 / 対象外: $notdir 件"

      # 本番へ配信されるのは **コミットされた** `packages/router/public/` である
      # （`deploy.yml` はビルドを行わない）。`merge_policy: auto-on-green` は
      # auto-deploy を意味するため、マージ前が人間不在で効く唯一の検出時点になる。
      # `deploy.yml` にも同じ検査があるが、そちらはマージ後にしか走らない。
      # 詳細: `.docs/ASSET_PATH_INCIDENT.md`
      - name: Check asset paths
        run: node scripts/check-asset-paths.js
